# Baselines on real BATADAL prepared windows (after ingest + prepare):
#   python -m water_gte_eval ingest configs/ingest/batadal.yaml
#   python -m water_gte_eval prepare configs/prepare/batadal.yaml
#   python -m water_gte_eval baselines configs/baselines/batadal.yaml
name: batadal-baselines
seed: 42

windows_path: data/processed/batadal__<scenario>_windows.parquet   # set to one prepared scenario file

labels:
  positive: attack

stages: {fit: train, threshold: val, eval: test}

baselines: [zscore, iforest, autoencoder, knn_raw, conformal, simple_knn_trust]

params:
  zscore: {limit: 3.0}
  iforest: {n_estimators: 100, max_samples: 256, contamination: 0.05}
  autoencoder: {hidden: 8, max_iter: 300}
  knn_raw: {k: 5, downsample: 16}
  conformal: {cal_frac: 0.5, positive_label: attack}
  simple_knn_trust: {k: 5}

threshold: {mode: val_best_f1}

event_metrics: {min_detected_windows: 1}

bootstrap: {unit: events, n_resamples: 1000, ci: 0.95, seed: 42}

output: {runs_dir: runs}
